name: 构建 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 解开工程包
        run: |
          echo "== 仓库里的文件 =="
          ls -la
          for z in *.zip; do
            [ -e "$z" ] || continue
            echo "解压 $z"
            unzip -o -q "$z" || true
          done
          # 万一混进了 Windows 反斜杠的坏包，清掉解出来的怪文件
          find . -type f -name '*\\*' -delete || true
          echo "== 解压之后 =="
          ls -la
          ls -la app || true

      - name: 装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 编译 debug 包
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: yutian-apk
          path: app/build/outputs/apk/debug/app-debug.apk
